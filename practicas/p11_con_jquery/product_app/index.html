<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <title>ProductApp</title>
    <!-- BOOTSTRAP 4  -->
    <link rel="stylesheet" href="https://bootswatch.com/4/superhero/bootstrap.min.css">
    <style>
      .status-message {
        font-size: 0.875rem;
        margin-top: 0.25rem;
        display: block;
      }
      .form-control.is-valid {
        border-color: #28a745;
      }
      .form-control.is-invalid {
        border-color: #dc3545;
      }
      .product-item {
        cursor: pointer;
        transition: all 0.3s ease;
      }
      .product-item:hover {
        background-color: rgba(255, 255, 255, 0.1);
      }
      .card {
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .validation-status {
        height: 20px;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>

    <!-- BARRA DE NAVEGACIÓN  -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <a class="navbar-brand" href=".">ProductApp</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav ml-auto"></ul>
          <form id="search-form" class="form-inline my-2 my-lg-0">
            <input class="form-control mr-sm-2" name="search" id="search" type="search" placeholder="ID, marca o descripción" aria-label="Search">
            <button class="btn btn-success my-2 my-sm-0" type="submit">Buscar</button>
          </form>
      </div>
    </nav>

    <div class="container">
      <div class="row p-4">
        <div class="col-md-5">
          <div class="card">
            <div class="card-body">
              <!-- FORMULARIO PARA AGREGAR PRODUCTO -->
              <form id="product-form">
    <div class="form-group">
    <label for="nombre" class="form-label">Nombre del Producto *</label>
    <input class="form-control" type="text" id="nombre" name="nombre" placeholder="Nombre de producto" required>
    <div class="validation-status">
        <span class="form-text text-warning status-message" id="nombre-status" style="display: none;"></span>
    </div>
</div>
    
    <div class="form-group">
        <label for="marca" class="form-label">Marca *</label>
        <input class="form-control" type="text" id="marca" name="marca" placeholder="Marca del producto" required>
        <div class="validation-status">
            <span class="form-text text-warning status-message" id="marca-status" style="display: none;"></span>
        </div>
    </div>

    <div class="form-group">
        <label for="modelo" class="form-label">Modelo *</label>
        <input class="form-control" type="text" id="modelo" name="modelo" placeholder="Modelo del producto" required>
        <div class="validation-status">
            <span class="form-text text-warning status-message" id="modelo-status" style="display: none;"></span>
        </div>
    </div>
    
    <div class="form-group">
        <label for="precio" class="form-label">Precio *</label>
        <input class="form-control" type="number" id="precio" name="precio" step="0.01" placeholder="Precio del producto" required>
        <div class="validation-status">
            <span class="form-text text-warning status-message" id="precio-status" style="display: none;"></span>
        </div>
    </div>
    
    <div class="form-group">
        <label for="unidades" class="form-label">Unidades *</label>
        <input class="form-control" type="number" id="unidades" name="unidades" placeholder="Unidades disponibles" required>
        <div class="validation-status">
            <span class="form-text text-warning status-message" id="unidades-status" style="display: none;"></span>
        </div>
    </div>
    
    <div class="form-group">
        <label for="detalles" class="form-label">Detalles</label>
        <textarea class="form-control" id="detalles" name="detalles" cols="30" rows="3" placeholder="Detalles del producto"></textarea>
    </div>

    <div class="form-group">
        <label for="imagen" class="form-label">Imagen</label>
        <input class="form-control" type="text" id="imagen" name="imagen" placeholder="URL de la imagen" value="img/default.png">
    </div>
    
    <input type="hidden" id="productId" name="id">
    <button id="submit-btn" class="btn btn-primary btn-block text-center" type="submit">
        Agregar Producto
    </button>
    <button id="cancel-btn" type="button" class="btn btn-secondary btn-block mt-2" style="display: none;">
        Cancelar Edición
    </button>
    <button type="button" class="btn btn-warning btn-block mt-2" onclick="limpiarFormulario()">
        Limpiar Formulario
    </button>
</form>
            </div>
          </div>
        </div>

        <!-- TABLA  -->
        <div class="col-md-7">
          <div class="card my-4 d-none" id="product-result">
            <div class="card-body">
              <!-- RESULTADO -->
              <ul id="container"></ul>
            </div>
          </div>

          <table class="table table-bordered table-sm">
            <thead>
              <tr>
                <td>Id</td>
                <td>Nombre</td>
                <td>Marca</td>
                <td>Modelo</td>
                <td>Precio</td>
                <td>Unidades</td>
                <td>Acciones</td>
              </tr>
            </thead>
            <tbody id="products"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Lógica del Frontend -->
    <script src="app.js"></script>
  </body>
</html>
