<!DOCTYPE html>
<html>
<head>
    <title>Formulario JSON - Evidencia 4</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        form { max-width: 400px; padding: 20px; border: 1px solid #ccc; }
        input, textarea { width: 100%; margin: 5px 0; padding: 8px; }
        button { background: #28a745; color: white; padding: 10px; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Formulario para probar JSON - Evidencia 4</h2>
    
    <form action="http://localhost/Tecweb/practicas/p13-Slim/testjson" method="post">
        <div>
            <label>Usuario:</label>
            <input type="text" name="usuario" value="rodolfo" required>
        </div>
        
        <div>
            <label>Email:</label>
            <input type="email" name="email" value="rodolfo@ejemplo.com" required>
        </div>
        
        <div>
            <label>Edad:</label>
            <input type="number" name="edad" value="25" required>
        </div>
        
        <div>
            <label>Ciudad:</label>
            <input type="text" name="ciudad" value="Puebla" required>
        </div>
        
        <button type="submit">Enviar JSON</button>
    </form>
</body>
</html>
